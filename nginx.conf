# StreamParty — NGINX Configuration
# Place at: /etc/nginx/sites-available/streamparty
# Enable:   ln -s /etc/nginx/sites-available/streamparty /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name watch.relay.media;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name watch.relay.media;

    # ── SSL (Let's Encrypt via certbot) ────────────────────
    ssl_certificate     /etc/letsencrypt/live/watch.relay.media/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/watch.relay.media/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security headers ───────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options           SAMEORIGIN                            always;
    add_header X-Content-Type-Options    nosniff                               always;
    add_header Referrer-Policy           strict-origin-when-cross-origin       always;

    # ── API proxy (/api/*) ─────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_buffering    off;

        # File uploads up to 10 MB
        client_max_body_size 10m;
    }

    # ── WebSocket signaling (/ws) ──────────────────────────
    location /ws {
        proxy_pass         http://127.0.0.1:3001/ws;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;   # Keep WS open 1 hour
        proxy_send_timeout 3600s;
    }

    # ── Health check (no auth) ─────────────────────────────
    location /health {
        proxy_pass       http://127.0.0.1:3001/health;
        proxy_set_header Host $host;
        access_log       off;
    }

    # ── Static files (cPanel-hosted HTML/CSS/JS) ──────────
    # OPTION A: VPS serves static files from local directory
    # Copy public/ here: /var/www/streamparty/public/
    root  /var/www/streamparty/public;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
        expires 1h;
        add_header Cache-Control "public, no-transform";
    }

    # ── Uploads (thumbnails) ──────────────────────────────
    location /api/uploads/ {
        # Handled by Node, but also aliased here for direct serving
        alias /var/www/streamparty/uploads/;
        expires 1h;
        access_log off;
    }

    # ── Gzip ──────────────────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/json application/javascript text/xml;

    # ── Logs ──────────────────────────────────────────────
    access_log /var/log/nginx/streamparty.access.log;
    error_log  /var/log/nginx/streamparty.error.log warn;
}

# ─────────────────────────────────────────────────────────────
# NOTE: If cPanel hosts static files (separate subdomain/IP):
# Comment out the "root" and "location /" block above.
# cPanel will serve HTML/CSS/JS; NGINX only handles /api/* and /ws.
# Make sure cPanel's domain also has SSL, and that you upload
# the public/ folder contents to public_html/.
# ─────────────────────────────────────────────────────────────
